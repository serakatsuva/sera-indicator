name: Sera Autonomous Engine — Deriv + optional Luna

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/update-signals.yml'
      - 'scripts/update-signals.mjs'
      - 'scripts/open_source_ensemble.py'
      - 'requirements-ml.txt'
      - 'requirements-foundation.txt'
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: write

concurrency:
  group: sera-indicator-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-ml.txt
            requirements-foundation.txt

      - name: Install core open-source models
        run: python -m pip install -r requirements-ml.txt

      - name: Decide foundation-model cycle
        id: foundation
        shell: bash
        run: |
          minute="$(date -u +%M)"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$minute" -lt 12 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Chronos-2 + TimesFM cycle enabled."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Core XGBoost + LightGBM cycle only."
          fi

      - name: Cache Hugging Face models
        if: steps.foundation.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: sera-foundation-models-v1

      - name: Install Chronos-2 and TimesFM
        if: steps.foundation.outputs.run == 'true'
        run: python -m pip install -r requirements-foundation.txt

      - name: Check optional OpenAI advisor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OpenAI advisor unavailable: autonomous engine will run alone."
          else
            echo "OpenAI advisor configured: autonomous engine remains the primary decision maker."
          fi

      - name: Test Deriv signal engine
        run: node scripts/update-signals.mjs --self-test

      - name: Test open-source ensemble
        run: python scripts/open_source_ensemble.py --self-test

      - name: Analyze Deriv with autonomous engine and optional Luna
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCREENING_MODEL: gpt-5.6-luna
          CANDLES_OUTPUT: /tmp/sera-candles.json
        run: node scripts/update-signals.mjs

      - name: Run open-source model ensemble
        run: >-
          python scripts/open_source_ensemble.py
          --signals data/signals.json
          --candles /tmp/sera-candles.json
          --cache data/open-source-ai.json
          --foundation ${{ steps.foundation.outputs.run }}

      - name: Commit validated signals
        run: |
          git config user.name "sera-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json data/open-source-ai.json
          if git diff --cached --quiet; then
            echo "No signal changes to commit."
          else
            git commit -m "Update Sera Indicator Deriv signals"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin main; then
                exit 0
              fi
              echo "Push race detected; retry $attempt/3..."
              sleep 2
            done
            echo "Unable to push signals after 3 retries."
            exit 1
          fi
