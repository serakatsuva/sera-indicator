name: Sera Autonomous Engine — Deriv + Forex

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/update-signals.yml'
      - 'scripts/update-signals.mjs'
      - 'scripts/open_source_ensemble.py'
      - 'scripts/adaptive_evidence.py'
      - 'scripts/send_gmail_alerts.py'
      - 'scripts/qa_signals.py'
      - 'requirements-ml.txt'
      - 'requirements-foundation.txt'
  schedule:
    # Core models every 5 minutes; foundation models every 15 minutes.
    - cron: '2,17,32,47 * * * *'
    - cron: '7,12,22,27,37,42,52,57 * * * *'

permissions:
  contents: write

concurrency:
  group: sera-indicator-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cadence watchdog
        shell: bash
        run: |
          echo "Sera scheduled cadence: every 5 minutes (staggered)."
          echo "Run event: ${{ github.event_name }}"
          echo "Run started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-ml.txt
            requirements-foundation.txt

      - name: Install core open-source models
        run: python -m pip install -r requirements-ml.txt

      - name: Select free model cadence
        id: foundation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" || "$SCHEDULE" == "2,17,32,47 * * * *" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Core and foundation models enabled for strongest candidates."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Core models enabled; fresh foundation forecasts reused when valid."
          fi

      - name: Cache Hugging Face models
        if: steps.foundation.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: sera-foundation-models-v1

      - name: Install Chronos-2 and TimesFM
        if: steps.foundation.outputs.run == 'true'
        run: python -m pip install -r requirements-foundation.txt

      - name: Test multi-market signal engine
        run: node scripts/update-signals.mjs --self-test

      - name: Test open-source ensemble
        run: python scripts/open_source_ensemble.py --self-test

      - name: Test adaptive evidence engine
        run: python scripts/adaptive_evidence.py --self-test

      - name: Validate Gmail alert script
        run: python -m py_compile scripts/send_gmail_alerts.py

      - name: Analyze Deriv and Forex with autonomous engine
        env:
          CANDLES_OUTPUT: /tmp/sera-candles.json
        run: node scripts/update-signals.mjs

      - name: Run open-source model ensemble
        run: >-
          python scripts/open_source_ensemble.py
          --signals data/signals.json
          --candles /tmp/sera-candles.json
          --cache data/open-source-ai.json
          --foundation ${{ steps.foundation.outputs.run }}

      - name: Update adaptive evidence memory
        run: >-
          python scripts/adaptive_evidence.py
          --signals data/signals.json
          --candles /tmp/sera-candles.json
          --memory data/adaptive-evidence.json

      - name: Validate generated signals before publication
        run: python scripts/qa_signals.py

      - name: Send Gmail Swing alerts
        env:
          GMAIL_ALERT_FROM: ${{ secrets.GMAIL_ALERT_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ALERT_TO: ${{ secrets.GMAIL_ALERT_TO }}
        run: python scripts/send_gmail_alerts.py

      - name: Commit validated signals
        run: |
          git config user.name "sera-indicator-bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p /tmp/sera-generated/data
          cp data/signals.json /tmp/sera-generated/data/signals.json
          cp data/open-source-ai.json /tmp/sera-generated/data/open-source-ai.json
          cp data/adaptive-evidence.json /tmp/sera-generated/data/adaptive-evidence.json
          cp data/email-alert-state.json /tmp/sera-generated/data/email-alert-state.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sera-generated/data/signals.json data/signals.json
            cp /tmp/sera-generated/data/open-source-ai.json data/open-source-ai.json
            cp /tmp/sera-generated/data/adaptive-evidence.json data/adaptive-evidence.json
            cp /tmp/sera-generated/data/email-alert-state.json data/email-alert-state.json
            git add data/signals.json data/open-source-ai.json data/adaptive-evidence.json data/email-alert-state.json

            if git diff --cached --quiet; then
              echo "No signal changes to commit."
              exit 0
            fi

            git commit -m "Update Sera Indicator multi-market signals"
            if git push origin main; then
              exit 0
            fi

            echo "Push race detected; retry $attempt/3..."
            sleep 2
          done

          echo "Unable to push signals after 3 retries."
          exit 1
