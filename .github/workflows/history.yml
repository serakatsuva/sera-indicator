name: Sera Backtest History (Deriv)

on:
  workflow_dispatch:
    inputs:
      pages_h1:
        description: 'Pages de 1000 bougies H1'
        default: '12'
      pages_m15:
        description: 'Pages de 1000 bougies M15'
        default: '6'
      set:
        description: 'synthetic (indices synthetiques) ou real (Forex, metaux, indices, crypto)'
        default: 'synthetic'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download Deriv history
        run: node scripts/fetch-history.mjs --pages-h1 "${{ inputs.pages_h1 }}" --pages-m15 "${{ inputs.pages_m15 }}" --set "${{ inputs.set }}"
      - name: Publish on the research-data branch (kept out of main and of the web app)
        run: |
          FILE=$(ls research/deriv-*history.json.gz | head -1); NAME=$(basename "$FILE")
          cp "$FILE" /tmp/$NAME
          git config user.name "sera-research-bot"
          git config user.email "sera-research-bot@users.noreply.github.com"
          # keep the other data set already on the branch (synthetic / real)
          if git fetch --depth 1 origin research-data; then git checkout -f -B research-data FETCH_HEAD; else git checkout --orphan research-data; git rm -rfq .; fi
          cp /tmp/$NAME $NAME
          git add $NAME
          git commit -qm "Deriv history ($NAME) for the backtester [skip ci]"
          git push -f origin research-data
