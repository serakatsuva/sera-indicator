name: Sera Backtest History (Deriv)

on:
  workflow_dispatch:
    inputs:
      pages_h1:
        description: 'Pages de 1000 bougies H1'
        default: '12'
      pages_m15:
        description: 'Pages de 1000 bougies M15'
        default: '6'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download Deriv history
        run: node scripts/fetch-history.mjs --pages-h1 "${{ inputs.pages_h1 }}" --pages-m15 "${{ inputs.pages_m15 }}"
      - name: Publish on the research-data branch (kept out of main and of the web app)
        run: |
          cp research/deriv-history.json.gz /tmp/deriv-history.json.gz
          git config user.name "sera-research-bot"
          git config user.email "sera-research-bot@users.noreply.github.com"
          git checkout --orphan research-data
          git rm -rfq .
          cp /tmp/deriv-history.json.gz deriv-history.json.gz
          git add deriv-history.json.gz
          git commit -qm "Deriv history for the backtester [skip ci]"
          git push -f origin research-data
